<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickBasket - Grocery Delivery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#ffffff;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #ddd;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#008a4c;
}

.location{
  font-size:12px;
  color:#666;
}

.cart-btn{
  background:#008a4c;
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.banner{
  background:#dff7e8;
  padding:22px;
  border-radius:15px;
  margin-bottom:18px;
}

.banner h1{
  color:#006b3c;
  margin-bottom:8px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:18px;
  font-size:16px;
}

h2{
  margin-bottom:12px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  background:white;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
}

.product-img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product h3{
  margin-top:8px;
}

.price{
  color:#008a4c;
  font-size:18px;
  font-weight:bold;
  margin:6px 0;
}

.add{
  width:100%;
  border:0;
  background:#008a4c;
  color:white;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}

.cart{
  background:white;
  margin-top:25px;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 8px #ddd;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

.checkout{
  margin-top:20px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

.place-order{
  width:100%;
  padding:14px;
  border:0;
  background:#008a4c;
  color:white;
  font-size:17px;
  font-weight:bold;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(min-width:650px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <div class="logo">🛒 QuickBasket</div>
      <div class="location">📍 Fast Grocery Delivery</div>
    </div>

    <button class="cart-btn" onclick="goCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<div class="container">

  <div class="banner">
    <h1>Grocery at your doorstep 🛍️</h1>
    <p>Fresh groceries delivered quickly.</p>
  </div>

  <input
    class="search"
    type="text"
    id="search"
    placeholder="Search grocery products..."
    onkeyup="searchProducts()"
  >

  <h2>Popular Products</h2>

  <div class="products" id="products"></div>

  <div class="cart" id="cart">
    <h2>🛒 Your Cart</h2>

    <div id="cartItems">
      <p>Your cart is empty.</p>
    </div>

    <div class="total">
      Subtotal: ₹<span id="subtotal">0</span>
    </div>

    <div class="total">
      Delivery: ₹<span id="delivery">0</span>
    </div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <div class="checkout">

      <h2>📍 Delivery Details</h2>

      <input
        type="text"
        id="name"
        placeholder="Your Name"
      >

      <input
        type="tel"
        id="phone"
        placeholder="Mobile Number"
      >

      <textarea
        id="address"
        placeholder="Enter complete delivery address"
      ></textarea>

      <select id="payment">
        <option value="cod">💵 Cash on Delivery</option>
        <option value="upi">📱 UPI Payment</option>
      </select>

      <button class="place-order" onclick="placeOrder()">
        Place Order
      </button>

    </div>
  </div>

</div>

<footer>
  © 2026 QuickBasket Grocery Delivery
</footer>

<script>

const products = [

{
 name:"Rice 5 KG",
 price:350,
 image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Wheat Atta 5 KG",
 price:280,
 image:"https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Milk 1 Litre",
 price:60,
 image:"https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Apples 1 KG",
 price:140,
 image:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Banana 1 Dozen",
 price:70,
 image:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Tomato 1 KG",
 price:50,
 image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Potato 1 KG",
 price:40,
 image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=500&q=80"
},

{
 name:"Cooking Oil 1 L",
 price:150,
 image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=500&q=80"
}

];

let cart=[];

function displayProducts(list=products){

  const box=document.getElementById("products");

  box.innerHTML="";

  list.forEach((p,index)=>{

    box.innerHTML += `
      <div class="product">

        <img
          class="product-img"
          src="${p.image}"
          alt="${p.name}"
        >

        <h3>${p.name}</h3>

        <div class="price">
          ₹${p.price}
        </div>

        <button
          class="add"
          onclick="addToCart(${products.indexOf(p)})"
        >
          Add to Cart
        </button>

      </div>
    `;

  });
}

function addToCart(index){

  const product=products[index];

  const existing=cart.find(
    item=>item.name===product.name
  );

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      ...product,
      qty:1
    });
  }

  updateCart();

  alert(product.name+" added to cart!");
}

function updateCart(){

  const box=document.getElementById("cartItems");

  box.innerHTML="";

  let subtotal=0;
  let count=0;

  if(cart.length===0){

    box.innerHTML="<p>Your cart is empty.</p>";

  }

  cart.forEach((item,index)=>{

    subtotal += item.price * item.qty;
    count += item.qty;

    box.innerHTML += `
      <div class="cart-item">

        <div>
          <b>${item.name}</b><br>
          ₹${item.price} × ${item.qty}
        </div>

        <div>
          <button onclick="changeQty(${index},-1)">−</button>
          ${item.qty}
          <button onclick="changeQty(${index},1)">+</button>
        </div>

      </div>
    `;

  });

  let delivery = subtotal>0 ? 30 : 0;

  document.getElementById("cartCount").innerText=count;
  document.getElementById("subtotal").innerText=subtotal;
  document.getElementById("delivery").innerText=delivery;
  document.getElementById("total").innerText=subtotal+delivery;
}

function changeQty(index,change){

  cart[index].qty += change;

  if(cart[index].qty<=0){
    cart.splice(index,1);
  }

  updateCart();
}

function goCart(){

  document.getElementById("cart")
  .scrollIntoView({
    behavior:"smooth"
  });

}

function searchProducts(){

  const text=document
    .getElementById("search")
    .value
    .toLowerCase();

  const filtered=products.filter(
    p=>p.name.toLowerCase().includes(text)
  );

  displayProducts(filtered);
}

function placeOrder(){

  if(cart.length===0){
    alert("Please add products to cart first.");
    return;
  }

  const name=document
    .getElementById("name").value.trim();

  const phone=document
    .getElementById("phone").value.trim();

  const address=document
    .getElementById("address").value.trim();

  const payment=document
    .getElementById("payment").value;

  if(!name || !phone || !address){
    alert("Please enter your name, mobile number and address.");
    return;
  }

  if(payment==="upi"){
    alert(
      "UPI payment option selected. Real online payment gateway needs to be connected separately."
    );
    return;
  }

  const message =
    "🛒 NEW ORDER\n\n"+
    "Name: "+name+"\n"+
    "Mobile: "+phone+"\n"+
    "Address: "+address+"\n"+
    "Payment: "+payment;

  const whatsappNumber = "919705335701";

  alert(
    "Order placed successfully! 🎉\n\n"+
    "Thank you "+name+"!"
  );

  window.open(
    "https://wa.me/"+whatsappNumber+
    "?text="+encodeURIComponent(message),
    "_blank"
  );
}

displayProducts();
updateCart();

</script>

</body>
</html>
