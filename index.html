<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickBasket</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f6f6;
  color:#222;
}

/* HEADER */

header{
  background:white;
  padding:12px 15px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #ddd;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#008a4c;
}

.location{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.cart-btn{
  border:0;
  background:#008a4c;
  color:white;
  padding:10px 13px;
  border-radius:10px;
  font-weight:bold;
}

/* SEARCH */

.container{
  max-width:1000px;
  margin:auto;
  padding:12px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
}

/* CATEGORY BAR */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 2px 14px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  min-width:82px;
  background:white;
  border:1px solid #eee;
  border-radius:12px;
  padding:9px 8px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 1px 5px #ddd;
  cursor:pointer;
}

.category-btn span{
  display:block;
  font-size:27px;
  margin-bottom:4px;
}

.category-btn.active{
  background:#dff7e8;
  border:2px solid #008a4c;
  color:#006b3c;
}

/* BANNER */

.banner{
  background:#dff7e8;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
}

.banner h1{
  color:#006b3c;
  font-size:22px;
  margin-bottom:6px;
}

.banner p{
  color:#555;
}

/* CATEGORY TITLE */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
}

.section-head h2{
  font-size:20px;
}

.section-head small{
  color:#008a4c;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.product{
  background:white;
  border-radius:14px;
  padding:10px;
  box-shadow:0 2px 7px #ddd;
}

.product-img{
  width:100%;
  height:125px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product h3{
  font-size:14px;
  line-height:1.35;
  margin-top:8px;
  min-height:38px;
}

.price{
  color:#008a4c;
  font-size:18px;
  font-weight:bold;
  margin:6px 0;
}

.add{
  width:100%;
  border:0;
  background:#008a4c;
  color:white;
  padding:9px;
  border-radius:8px;
  font-weight:bold;
}

.empty{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:#777;
}

/* CART */

.cart{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-top:22px;
  box-shadow:0 2px 8px #ddd;
}

.cart h2{
  margin-bottom:12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.qty button{
  padding:4px 9px;
  margin:0 2px;
}

.total{
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:7px 0 10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

.place-order{
  width:100%;
  padding:14px;
  border:0;
  background:#008a4c;
  color:white;
  font-size:17px;
  font-weight:bold;
  border-radius:10px;
}

footer{
  text-align:center;
  color:#777;
  padding:30px;
}

/* DESKTOP */

@media(min-width:650px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .category-btn{
    min-width:110px;
  }

}

</style>
</head>


<body>


<header>

  <div class="top">

    <div>

      <div class="logo">
        🛒 QuickBasket
      </div>

      <div class="location">
        📍 Fast Grocery Delivery
      </div>

    </div>

    <button
      class="cart-btn"
      onclick="goCart()"
    >
      🛒 Cart
      (<span id="cartCount">0
