<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickBasket - Grocery Delivery</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f6f6;
  color:#222;
}

header{
  background:white;
  padding:12px 15px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #ddd;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#008a4c;
}

.location{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.cart-btn{
  border:0;
  background:#008a4c;
  color:white;
  padding:10px 13px;
  border-radius:10px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:12px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:12px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 2px 14px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  min-width:82px;
  background:white;
  border:1px solid #eee;
  border-radius:12px;
  padding:9px 8px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 1px 5px #ddd;
}

.category-btn span{
  display:block;
  font-size:27px;
  margin-bottom:4px;
}

.category-btn.active{
  background:#dff7e8;
  border:2px solid #008a4c;
  color:#006b3c;
}

.banner{
  background:#dff7e8;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
}

.banner h1{
  color:#006b3c;
  font-size:22px;
  margin-bottom:6px;
}

.banner p{
  color:#555;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
}

.section-head h2{
  font-size:20px;
}

.section-head small{
  color:#008a4c;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.product{
  background:white;
  border-radius:14px;
  padding:10px;
  box-shadow:0 2px 7px #ddd;
}

.product-img{
  width:100%;
  height:125px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product h3{
  font-size:14px;
  line-height:1.35;
  margin-top:8px;
}

.product small{
  display:block;
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.price{
  color:#008a4c;
  font-size:18px;
  font-weight:bold;
  margin:6px 0;
}

.add{
  width:100%;
  border:0;
  background:#008a4c;
  color:white;
  padding:9px;
  border-radius:8px;
  font-weight:bold;
}

.empty{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:#777;
}

.cart{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-top:22px;
  box-shadow:0 2px 8px #ddd;
}

.cart h2{
  margin-bottom:12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.qty button{
  padding:4px 9px;
  margin:0 2px;
}

.total{
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:7px 0 10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

.place-order{
  width:100%;
  padding:14px;
  border:0;
  background:#008a4c;
  color:white;
  font-size:17px;
  font-weight:bold;
  border-radius:10px;
}

footer{
  text-align:center;
  color:#777;
  padding:30px;
}

@media(min-width:650px){

  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .category-btn{
    min-width:110px;
  }

}

</style>
</head>

/* ================================

================================ */

function allProducts(){

  return [
    ...dairyProducts,
    ...vegetables,
    ...fruitsProducts,
    ...bakeryProducts,
    ...householdProducts,
    ...electronicsProducts,
    ...otherProducts
  ];

}


/* ================================

================================ */

let idCounter=0;

allProducts().forEach(product=>{

  product.id=idCounter++;

});


  let cart=[];

let currentCategory="all";


/* ================================
   PRODUCT CARD
================================ */

function productCard(product){

  return `

  <div class="product">

    <img
      class="product-img"
      src="${product.image}"
      alt="${product.english}"
    >

    <h3>
      ${product.name}
    </h3>

    <small>
      ${product.english}
    </small>

    <div class="price">
      ₹${product.price}
    </div>

    <button
      class="add"
      onclick="addToCart(${product.id})"
    >
      ADD
    </button>

  </div>

  `;

}


/* ================================
   DISPLAY PRODUCTS
================================ */

function displayProducts(list){

  const box=
    document.getElementById("products");

  box.innerHTML="";


  if(list.length===0){

    box.innerHTML=`

      <div class="empty">
        इस category में अभी कोई product नहीं है.
      </div>

    `;

    document.getElementById("productCount")
      .innerText="0 Products";

    return;

  }


  list.forEach(product=>{

    box.innerHTML +=
      productCard(product);

  });


  document.getElementById("productCount")
    .innerText=
    list.length+" Products";

}


/* ================================
   CATEGORY
================================ */

function showCategory(category,button){

  currentCategory=category;


  document
    .querySelectorAll(".category-btn")
    .forEach(btn=>{

      btn.classList.remove("active");

    });


  button.classList.add("active");


  let list=[];


  if(category==="all"){

    list=allProducts();

    document.getElementById("categoryTitle")
      .innerText="🛍️ All Products";

  }


  if(category==="dairy"){

    list=dairyProducts;

    document.getElementById("categoryTitle")
      .innerText="🥛 दूध और डेयरी";

  }


  if(category==="vegetables"){

    list=vegetables;

    document.getElementById("categoryTitle")
      .innerText="🥦 सब्ज़ियाँ — Daily Deals";

  }


  if(category==="fruits"){

    list=fruitsProducts;

    document.getElementById("categoryTitle")
      .innerText="🍎 फल";

  }


  if(category==="bakery"){

    list=bakeryProducts;

    document.getElementById("categoryTitle")
      .innerText="🍞 ब्रेड और बेकरी";

  }


  if(category==="household"){

    list=householdProducts;

    document.getElementById("categoryTitle")
      .innerText="🧹 घर का सामान";

  }


  if(category==="electronics"){

    list=electronicsProducts;

    document.getElementById("categoryTitle")

  }


  if(category==="other"){

    document.getElementById("categoryTitle")

  }


  document.getElementById("search")
    .value="";


  displayProducts(list);

/* ================================
   SEARCH
================================ */

function searchProducts(){

  const text=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(text===""){

    if(currentCategory==="all"){

      displayProducts(
        allProducts()
      );

    }

    else if(currentCategory==="dairy"){

      displayProducts(
        dairyProducts
      );

    }

    else if(currentCategory==="vegetables"){

      displayProducts(
        vegetables
      );

    }

    else if(currentCategory==="fruits"){

      displayProducts(
        fruitsProducts
      );

    }

    else if(currentCategory==="bakery"){

      displayProducts(
        bakeryProducts
      );

    }

    else if(currentCategory==="household"){

      displayProducts(
        householdProducts
      );

    }

    else if(currentCategory==="electronics"){

      displayProducts(
        electronicsProducts
      );

    }

    else if(currentCategory==="other"){

      displayProducts(
        otherProducts
      );

    }

    return;

  }


  const results=
    allProducts().filter(product=>{

      return (

        product.name
          .toLowerCase()
          .includes(text)

        ||

        product.english
          .toLowerCase()
          .includes(text)

      );

    });


  document.getElementById("categoryTitle")
    .innerText="🔍 Search Results";


  displayProducts(results);

}


/* ================================
   ADD TO CART
================================ */

function addToCart(id){

  const product=
    allProducts().find(
      item=>item.id===id
    );


  if(!product){

    return;

  }


  const existing=
    cart.find(
      item=>item.id===id
    );


  if(existing){

    existing.qty++;

  }

  else{

    cart.push({

      ...product,

      qty:1

    });

  }


  updateCart();


  alert(
    product.name+
    " cart में add हो गया!"
  );

}


/* ================================
   UPDATE CART
================================ */

function updateCart(){

  const box=
    document.getElementById("cartItems");

  box.innerHTML="";


  let subtotal=0;

  let count=0;


  if(cart.length===0){

    box.innerHTML=
      "<p>Your cart is empty.</p>";

  }


  cart.forEach((item,index)=>{

    subtotal +=
      item.price*item.qty;

    count +=
      item.qty;


    box.innerHTML += `

    <div class="cart-item">

      <div>

        <b>
          ${item.name}
        </b>

        <br>

        ₹${item.price}
        ×
        ${item.qty}

      </div>


      <div class="qty">

        <button
          onclick="changeQty(${index},-1)"
        >
          −
        </button>

        ${item.qty}

        <button
          onclick="changeQty(${index},1)"
        >
          +
        </button>

      </div>

    </div>

    `;

  });


  const delivery=
    subtotal>0 ? 30 : 0;


  const handling=
    subtotal>0 ? 5 : 0;


  const total=
    subtotal+
    delivery+
    handling;


  document.getElementById("cartCount")
    .innerText=count;


  document.getElementById("subtotal")
    .innerText=subtotal;


  document.getElementById("delivery")
    .innerText=delivery;


  document.getElementById("handlingCharge")
    .innerText=handling;


  document.getElementById("total")
    .innerText=total;

}


/* ================================
   CHANGE QUANTITY
================================ */

function changeQty(index,change){

  cart[index].qty += change;


  if(cart[index].qty<=0){

    cart.splice(index,1);

  }


  updateCart();

}


/* ================================
   GO TO CART
================================ */

function goCart(){

  document
    .getElementById("cart")
    .scrollIntoView({

      behavior:"smooth"

    });

}


/* ================================
   PLACE ORDER
================================ */

function placeOrder(){

  if(cart.length===0){

    alert(
      "Please add products to cart first."
    );

    return;

  }


  const name=
    document
      .getElementById("name")
      .value
      .trim();


  const phone=

      .getElementById("phone")
      .value
      .trim();


  const address=
    document
      .getElementById("address")
      .value
      .trim();


  const payment=
    document
      .getElementById("payment")
      .value;


  if(!name || !phone || !address){

    alert(
      "Please enter your name, mobile number and address."
    );

    return;

  }


  if(payment==="upi"){

    alert(
      "UPI payment option selected. Real online payment gateway needs to be connected separately."
    );

    return;

  }


  let orderItems="";

  let subtotal=0;


  cart.forEach(item=>{

    const itemTotal=
      item.price*item.qty;


    subtotal +=
      itemTotal;


    orderItems +=
      "• "+
      item.english+
      " × "+
      item.qty+
      " = ₹"+
      itemTotal+
      "\n";

  });


  const delivery=
    subtotal>0 ? 30 : 0;


  const handling=
    subtotal>0 ? 5 : 0;


  const total=
    subtotal+
    delivery+
    handling;


  function openWhatsApp(locationText){

    const message=

      "🛒 NEW QUICKBASKET ORDER\n\n"+

      "Products:\n"+
      orderItems+

      "\nSubtotal: ₹"+
      subtotal+

      "\nDelivery: ₹"+
      delivery+

      "\nHandling Charge: ₹"+
      handling+

      "\nTotal: ₹"+
      total+

      "\n\nName: "+
      name+

      "\nMobile: "+
      phone+

      "\nAddress: "+
      address+

      "\n"+
      locationText+

      "Payment: "+
      payment.toUpperCase();


    const whatsappNumber=
      "919705335701";


    window.location.href=
      "https://wa.me/"+
      whatsappNumber+
      "?text="+
      encodeURIComponent(message);

  }


  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(

      function(position){

        const lat=
          position.coords.latitude;


        const lon=
          position.coords.longitude;


        const locationLink=
          "https://www.google.com/maps?q="+
          lat+
          ","+
          lon;


        openWhatsApp(

          "📍 Current Location:\n"+
          locationLink+
          "\n"

        );

      },


      function(){

        openWhatsApp(
          "📍 Current Location: Not shared\n"
        );

      }

    );

  }

  else{

    openWhatsApp(
      "📍 Current Location: Not available\n"
    );

  }

}


/* ================================
   FEEDBACK
================================ */

function sendFeedback(){

  const rating=
    document
      .getElementById("feedbackRating")
      .value;


  const feedback=
    document
      .getElementById("feedbackText")
      .value
      .trim();


  if(!rating){

    alert(
      "Please select a rating."
    );

    return;

  }


  if(!feedback){

    alert(
      "Please write your feedback."
    );

    return;

  }


  const message=

    "⭐ QUICKBASKET FEEDBACK\n\n"+

    "Rating: "+
    rating+
    "/5\n"+

    "Feedback: "+
    feedback;


  const whatsappNumber=
    "919705335701";


  window.location.href=
    "https://wa.me/"+
    whatsappNumber+
    "?text="+
    encodeURIComponent(message);

}

);
